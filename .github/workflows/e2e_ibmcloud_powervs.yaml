# Run IBM Cloud PowerVS e2e tests.
name: (Callable) ibmcloud-powervs e2e tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
    inputs:
      caa_image:
        description: The cloud-api-adaptor OCI image (including tag) e.g. quay.io/confidential-containers/cloud-api-adaptor:latest
        required: true
        type: string
      peerpod_ctrl_image:
        description: The peerpod-ctrl OCI image (including tag)
        required: false
        default: ''
        type: string
      webhook_image:
        description: The peer-pods-webhook OCI image (including tag)
        required: false
        default: ''
        type: string
      git_ref:
        default: 'main'
        description: Git ref to checkout the cloud-api-adaptor repository. Defaults to main.
        required: false
        type: string
  workflow_call:
    inputs:
      podvm_image:
        description: The podvm image to use. If not provided, will build locally.
        required: false
        default: ''
        type: string
      caa_image:
        type: string
        required: true
      peerpod_ctrl_image:
        description: The peerpod-ctrl OCI image (including tag)
        required: false
        default: ''
        type: string
      webhook_image:
        description: The peer-pods-webhook OCI image (including tag)
        required: false
        default: ''
        type: string
      git_ref:
        default: 'main'
        description: Git ref to checkout the cloud-api-adaptor repository. Defaults to main.
        required: false
        type: string
      forwarder_port:
        description: The port the agent protocol forwarder listens on inside the pod VM. Defaults to 15150.
        required: false
        default: ''
        type: string

env:
  CLOUD_PROVIDER: ibmcloud_powervs
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    working-directory: src/cloud-api-adaptor

permissions: {}

jobs:
  test-ibmcloud-powervs:
    name: "IBM Cloud PowerVS e2e tests"
    runs-on: ubuntu-24.04
    env:
      CAA_IMAGE: "${{ inputs.caa_image }}"
      PEERPOD_CTRL_IMAGE: "${{ inputs.peerpod_ctrl_image }}"
      WEBHOOK_IMAGE: "${{ inputs.webhook_image }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Rebase the code
        if: github.event_name == 'pull_request_target'
        working-directory: ./
        run: |
          ./hack/ci-helper.sh rebase-atop-of-the-latest-target-branch

      - name: Remove unnecessary directories to free up space
        working-directory: ./
        run: |
          sudo ./hack/ci-helper.sh clean-up-runner

      - name: Read properties from versions.yaml
        run: |
          sudo snap install yq
          go_version="$(yq '.tools.golang' versions.yaml)"
          [ -n "$go_version" ]
          {
            echo "GO_VERSION=${go_version}"
            echo "HELM_VERSION=$(yq -e '.tools.helm.version' versions.yaml)"
            echo "HELM_CHECKSUM=$(yq -e '.tools.helm.sha256' versions.yaml)"
          } >> "$GITHUB_ENV"

      - name: Setup Golang version ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Helm
        run: |
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_CHECKSUM}  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Config ibmcloud-powervs
        env:
          IBMCLOUD_API_KEY: ${{ secrets.IBMCLOUD_API_KEY }}
          IBMCLOUD_ACCOUNT_ID: ${{ secrets.IBMCLOUD_ACCOUNT_ID }}
          POWERVS_ZONE: ${{ secrets.POWERVS_ZONE }}
          POWERVS_SERVICE_INSTANCE_ID: ${{ secrets.POWERVS_SERVICE_INSTANCE_ID }}
          POWERVS_IMAGE_ID: ${{ secrets.POWERVS_IMAGE_ID }}
          POWERVS_NETWORK_ID: ${{ secrets.POWERVS_NETWORK_ID }}
          POWERVS_SSH_KEY_NAME: ${{ secrets.POWERVS_SSH_KEY_NAME }}
          FORWARDER_PORT: "2005"
          PROXY_TIMEOUT: "15m"
          USE_PUBLIC_IP: "true"
        run: |
          # Copy the default properties file
          cp test/provisioner/ibmcloud-powervs/ibmcloud-powervs.properties powervs.properties

          # Split CAA_IMAGE into CAA_IMAGE_NAME and CAA_IMAGE_TAG
          CAA_IMAGE_TAG="${CAA_IMAGE##*:}"
          CAA_IMAGE_NAME="${CAA_IMAGE%:*}"

          # Replace values that need to be changed
          sed -i "s|^IBMCLOUD_API_KEY=.*|IBMCLOUD_API_KEY=\"${IBMCLOUD_API_KEY}\"|" powervs.properties
          sed -i "s|^IBMCLOUD_ACCOUNT_ID=.*|IBMCLOUD_ACCOUNT_ID=\"${IBMCLOUD_ACCOUNT_ID}\"|" powervs.properties
          sed -i "s|^POWERVS_ZONE=.*|POWERVS_ZONE=\"${POWERVS_ZONE}\"|" powervs.properties
          sed -i "s|^POWERVS_SERVICE_INSTANCE_ID=.*|POWERVS_SERVICE_INSTANCE_ID=\"${POWERVS_SERVICE_INSTANCE_ID}\"|" powervs.properties
          sed -i "s|^POWERVS_IMAGE_ID=.*|POWERVS_IMAGE_ID=\"${POWERVS_IMAGE_ID}\"|" powervs.properties
          sed -i "s|^POWERVS_NETWORK_ID=.*|POWERVS_NETWORK_ID=\"${POWERVS_NETWORK_ID}\"|" powervs.properties
          sed -i "s|^POWERVS_SSH_KEY_NAME=.*|POWERVS_SSH_KEY_NAME=\"${POWERVS_SSH_KEY_NAME}\"|" powervs.properties
          sed -i "s|^CAA_IMAGE=.*|CAA_IMAGE=\"${CAA_IMAGE_NAME}\"|" powervs.properties
          sed -i "s|^CAA_IMAGE_TAG=.*|CAA_IMAGE_TAG=\"${CAA_IMAGE_TAG}\"|" powervs.properties
          sed -i "s|^FORWARDER_PORT=.*|FORWARDER_PORT=\"${FORWARDER_PORT}\"|" powervs.properties
          sed -i "s|^PROXY_TIMEOUT=.*|PROXY_TIMEOUT=\"${PROXY_TIMEOUT}\"|" powervs.properties
          sed -i "s|^USE_PUBLIC_IP=.*|USE_PUBLIC_IP=\"${USE_PUBLIC_IP}\"|" powervs.properties
          sed -i "s|^CONTAINER_RUNTIME=.*|CONTAINER_RUNTIME=\"${CONTAINER_RUNTIME}\"|" powervs.properties

          # For debugging (API key masked)
          echo "::group::powervs.properties"
          sed 's|\(IBMCLOUD_API_KEY=\).*|\1"***"|' powervs.properties
          echo "::endgroup::"

      - name: Run tests
        id: runTests
        run: |
          export CLOUD_PROVIDER=ibmcloud_powervs
          export DEPLOY_KBS=false
          export TEST_PROVISION=yes
          export TEST_TEARDOWN=yes
          export TEST_PROVISION_FILE="$PWD/powervs.properties"
          export TEST_E2E_TIMEOUT="90m"

          make test-e2e

      - name: Debug tests failure
        if: failure() && steps.runTests.outcome == 'failure'
        working-directory: ./
        run: |
          export KUBECONFIG="${HOME}/kube_peer-pods"
          kind get kubeconfig -n "peer-pods" > "$KUBECONFIG"
          ./hack/ci-e2e-debug-fail.sh
        # Avoid running with `set -e` as command fails should be allowed
        shell: bash {0}
